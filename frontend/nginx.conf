server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 'ok'; }

    # Resolve the service again if Docker replaces its container/IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Do not turn probes for source/configuration into SPA responses.
    location ~* (^/(@vite|@fs|src|node_modules|backend|scripts|results)(/|$)|/\.|\.map$) { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
