# Installed images only; build/pull is an explicit preparation step.
name: holiday-booking
services:
  mysql:
    image: mysql:8.4
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: holiday_booking
      MYSQL_USER: holiday_booking
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in config/development.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in config/development.env}
    ports:
    - 127.0.0.1:${MYSQL_PORT:-3307}:3306
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    - --default-time-zone=+00:00
    volumes:
    - mysql-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -u"$${MYSQL_USER}"
        "$${MYSQL_DATABASE}" --batch --skip-column-names -e 'SELECT 1' >/dev/null
        2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
  wiremock:
    image: wiremock/wiremock:3.13.2-2
    pull_policy: never
    restart: unless-stopped
    command:
    - --global-response-templating
    - --permitted-system-keys
    - CALLBACK_ORIGIN
    - --no-request-journal
    - --disable-request-logging
    - --proxy-timeout
    - "8000"
    environment:
      CALLBACK_ORIGIN: http://host.docker.internal:${SERVER_PORT:-8080}
    volumes:
    - ./wiremock:/home/wiremock:ro
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    ports:
    - 127.0.0.1:${WIREMOCK_PORT:-9090}:8080
volumes:
  mysql-data: null
