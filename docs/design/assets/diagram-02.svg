<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1110" role="img" aria-labelledby="hb-diagram-2-title">
<title id="hb-diagram-2-title">预订与支付时序</title>
<defs>
<marker id="hb-diagram-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#557180"/></marker>
<marker id="hb-diagram-2-triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="white" stroke="#557180"/></marker>
</defs><rect width="100%" height="100%" fill="white"/>
<style>#hb-diagram-2-canvas text{font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;fill:#173747} #hb-diagram-2-canvas .edge-label{font-size:12px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style><g id="hb-diagram-2-canvas"><line x1="110" y1="90" x2="110" y2="1080" stroke="#b8c7cf" stroke-dasharray="5 5"/><rect x="6.0" y="19.0" width="208" height="58" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="110" y="53" text-anchor="middle" font-size="15" font-weight="600" >顾客</text><line x1="340" y1="90" x2="340" y2="1080" stroke="#b8c7cf" stroke-dasharray="5 5"/><rect x="236.0" y="19.0" width="208" height="58" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="340" y="53" text-anchor="middle" font-size="15" font-weight="600" >Vue</text><line x1="570" y1="90" x2="570" y2="1080" stroke="#b8c7cf" stroke-dasharray="5 5"/><rect x="466.0" y="19.0" width="208" height="58" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="570" y="53" text-anchor="middle" font-size="15" font-weight="600" >预订 / 支付应用服务</text><line x1="800" y1="90" x2="800" y2="1080" stroke="#b8c7cf" stroke-dasharray="5 5"/><rect x="696.0" y="19.0" width="208" height="58" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="800" y="53" text-anchor="middle" font-size="15" font-weight="600" >MySQL</text><line x1="1030" y1="90" x2="1030" y2="1080" stroke="#b8c7cf" stroke-dasharray="5 5"/><rect x="926.0" y="19.0" width="208" height="58" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="1030" y="53" text-anchor="middle" font-size="15" font-weight="600" >支付渠道</text><polyline points="110,130 340,130" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="225.0" y="120" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">确认报价与预订</text><text x="455.0" y="165" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">POST /bookings</text><polyline points="340,194 570,194" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="455.0" y="184" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">Idempotency-Key</text><polyline points="570,258 800,258" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="685.0" y="248" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">事务：分配房间、锁房、订单和支付单</text><polyline points="800,322 570,322" fill="none" stroke="#557180" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#hb-diagram-2-arrow)"/><text x="685.0" y="312" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">提交</text><polyline points="570,386 340,386" fill="none" stroke="#557180" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#hb-diagram-2-arrow)"/><text x="455.0" y="376" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">预订号、应付金额、截止时间</text><polyline points="340,450 570,450" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="455.0" y="440" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">创建支付尝试</text><polyline points="570,514 800,514" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="685.0" y="504" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">保存唯一渠道订单号</text><polyline points="570,578 1030,578" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="800.0" y="568" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">事务外发起支付</text><polyline points="1030,642 340,642" fill="none" stroke="#557180" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#hb-diagram-2-arrow)"/><text x="685.0" y="632" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">收银台或二维码</text><polyline points="1030,706 570,706" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="800.0" y="696" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">服务器支付通知</text><polyline points="570,770 660,770 660,795 570,795" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="610" y="760" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">验签、核对身份、金额、业务关联</text><polyline points="570,834 800,834" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="685.0" y="824" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">事务：付款确认、确认库存、建立提醒</text><polyline points="570,898 1030,898" fill="none" stroke="#557180" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#hb-diagram-2-arrow)"/><text x="800.0" y="888" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">持久化成功后 ACK</text><polyline points="340,962 570,962" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-2-arrow)"/><text x="455.0" y="952" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">查询支付/预订状态</text><polyline points="570,1026 340,1026" fill="none" stroke="#557180" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#hb-diagram-2-arrow)"/><text x="455.0" y="1016" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">已确认</text></g></svg>