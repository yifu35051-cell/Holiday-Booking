<style>#hb-diagram-3-canvas text{font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;fill:#173747} #hb-diagram-3-canvas .edge-label{font-size:12px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style><g id="hb-diagram-3-canvas"><circle cx="285" cy="32" r="8" fill="#173747"/><polyline points="285,40 285,94" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-3-arrow)"/><polyline points="285,166 285,424" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-3-arrow)"/><text x="285" y="340" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">可信付款成功且仍占库存</text><polyline points="394.0,130 686.0,290" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-3-arrow)"/><text x="540.0" y="202.0" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">付款期限到达</text><polyline points="795,326.0 795,424.0" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-3-arrow)"/><text x="795.0" y="367.0" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">渠道确认关闭且未支付</text><polyline points="686,290 550,290 550,460 394,460" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-3-arrow)"/><text x="585" y="383" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">渠道确认付款且库存仍保留</text><polyline points="285,496.0 285,669.0" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-3-arrow)"/><text x="285.0" y="574.5" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">退房日期已过的归档</text><polyline points="176,130 65,130 65,770 795,770 795,741" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-3-arrow)"/><text x="500" y="793" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">CR1且确认无在途付款</text><polyline points="394,460 670,705" fill="none" stroke="#557180" stroke-width="1.6" marker-end="url(#hb-diagram-3-arrow)"/><text x="540" y="575" text-anchor="middle" font-size="12" font-weight="400" class="edge-label">CR1符合取消政策</text><rect x="176.0" y="94.0" width="218" height="72" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="285" y="127" text-anchor="middle" font-size="15" font-weight="600" >PENDING_PAYMENT</text><text x="285" y="151" text-anchor="middle" font-size="12" font-weight="400" >待付款 / 已锁房</text><rect x="686.0" y="254.0" width="218" height="72" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="795" y="287" text-anchor="middle" font-size="15" font-weight="600" >EXPIRING</text><text x="795" y="311" text-anchor="middle" font-size="12" font-weight="400" >关单与付款结果核实中</text><rect x="176.0" y="424.0" width="218" height="72" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="285" y="457" text-anchor="middle" font-size="15" font-weight="600" >CONFIRMED</text><text x="285" y="481" text-anchor="middle" font-size="12" font-weight="400" >已确认 / 库存 BOOKED</text><rect x="686.0" y="424.0" width="218" height="72" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="795" y="457" text-anchor="middle" font-size="15" font-weight="600" >EXPIRED</text><text x="795" y="481" text-anchor="middle" font-size="12" font-weight="400" >确认未付款后释放库存</text><rect x="176.0" y="669.0" width="218" height="72" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="285" y="702" text-anchor="middle" font-size="15" font-weight="600" >COMPLETED</text><text x="285" y="726" text-anchor="middle" font-size="12" font-weight="400" >住宿日期过后的归档</text><rect x="670.0" y="669.0" width="250" height="72" rx="10" fill="#edf5f7" stroke="#a6bcc7" stroke-width="1.5"/><text x="795" y="702" text-anchor="middle" font-size="15" font-weight="600" >CANCELLED</text><text x="795" y="726" text-anchor="middle" font-size="12" font-weight="400" >CR1 取消；退款状态单独跟踪</text></g></svg>