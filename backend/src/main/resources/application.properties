spring.application.name=holiday-booking
spring.task.scheduling.pool.size=2
spring.profiles.default=local
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never

# MySQL is required for normal execution; H2 is deliberately test-scoped only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/holiday_booking?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:holiday_booking}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Optional Alipay sandbox integration; not required for the default local mock.
booking.alipay.app-id=${ALIPAY_APP_ID:}
booking.alipay.private-key=${ALIPAY_PRIVATE_KEY:}
booking.alipay.public-key=${ALIPAY_PUBLIC_KEY:}
booking.alipay.seller-id=${ALIPAY_SELLER_ID:}
booking.alipay.notify-url=${ALIPAY_NOTIFY_URL:}
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 */5 * * * *

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

booking.zone=Asia/Shanghai
booking.quote-ttl=10m
booking.hold-ttl=15m
booking.advance-days=365
booking.max-nights=30
booking.max-rooms=10
booking.check-in-time=15:00
booking.reminder-time=09:00
booking.jobs-enabled=${JOBS_ENABLED:true}
booking.job-delay-ms=60000
booking.bootstrap-email=${BOOTSTRAP_ADMIN_EMAIL:}
booking.bootstrap-password=${BOOTSTRAP_ADMIN_PASSWORD:}
booking.payment-mode=${PAYMENT_MODE:disabled}
booking.email-mode=${EMAIL_MODE:disabled}
booking.email-daily-limit=${EMAIL_DAILY_LIMIT:50}
booking.email-from=${MAIL_FROM:}
booking.email-allowlist=${MAIL_RECIPIENT_ALLOWLIST:}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
