# MySqlTestSupport injects a temporary container connection before context refresh.
# Fail closed if a new test forgets that base class; never connect to the dev database.
spring.datasource.url=jdbc:mysql://127.0.0.1:1/test_initializer_required
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=test_initializer_required
spring.datasource.password=test_initializer_required
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
booking.jobs-enabled=false
# 测试不继承启动终端中可能存在的真实管理员初始化配置。
booking.bootstrap-email=
booking.bootstrap-password=
booking.payment-mode=mock
booking.email-mode=log
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
